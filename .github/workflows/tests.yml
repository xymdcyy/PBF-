name: tests

on:
  push:
    branches: [main]
  pull_request:

# 只读权限：本工作流只跑测试，不发布任何产物
permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # 按提交 SHA 锁定第三方 action（tag 可被移动，SHA 不可变）
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # 测试本身不连 Excel/AO（pywin32 相关由 tests/_stubs.py 打桩），
      # 但 test_clear 依赖 pandas、test_template_export 依赖 openpyxl，
      # 直接按 requirements.txt 装全量运行依赖，保证 CI 与真实运行环境一致。
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
