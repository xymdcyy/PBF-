# CBG 其他成本编制表 — E61 品类 / ROWA 品牌
# 结构: simple — 单科目(末级) × 期间矩阵
# 2026-11-11 live 扫描确认: header_row=57, 科目列 AC(末级), 期间 AF..AV
form_id: E61_CBG_其他成本编制
label: "其他成本"
workbook_pattern: "YCCBW028_其他成本编制表_CBG*"
sheet: "CBG其他成本编制表"
layout: simple

header_row: 57

# 模式区 — 本表"打开即为编辑态"，可直接录入并保存。
# 注意：G51/G52 不是 AO 的模式标记（真正的标记是 AL52"当前模式:" / AM52），
# 也不要调用 Switch_mode —— 调用后反而会切成只读，保存时弹"没有要保存的资源，请检查！"并阻塞。
mode_cell: null
mode_label_cell: null
mode_switch:
  macro: null
  force_set: false

# 版本区 — F4 是显示文本；E4/G4 是成员键 (如 C03202611V1)
version_cell: "F4"             # 预算版本显示文本
version_key_cell: "E4"         # 目标版本成员键（切版本写这里）
version_current_cell: "G4"     # SAP 当前变量值
version_match_cell: "H4"       # Y=目标与当前一致

# 行匹配 — AC=末级科目名(唯一)，AA/AB 仅作兜底
item_column: "AC"
item_alternate_columns: ["AA", "AB"]
input_rows: [58, 88]
skip_rows: [66, 67, 68]        # PBF 宏参数行

# 期间列 — 全期间 (2026.01 ~ 2027.04)
month_columns:
  "2026.01": AF
  "2026.02": AG
  "2026.03": AH
  "2026.04": AI
  "2026.05": AJ
  "2026.06": AK
  "2026.07": AL
  "2026.08": AM
  "2026.09": AN
  "2026.10": AO
  "2026.11": AP
  "2026.12": AQ
  "2027.01": AS
  "2027.02": AT
  "2027.03": AU
  "2027.04": AV

macros:
  save: "Plan_Save"
  refresh: "Refresh_Sheet"
  switch_mode: "Switch_mode"

nav_cell: "AC63"               # CBG-其他成本编制-智屏-乐华

item_aliases:
  "销售收入": ["销售收入"]
  "维修费": ["售后服务费-维修费"]
  "呼叫中心": ["售后服务费-呼叫中心费用"]
  "质保金": ["售后服务费-质保金"]
  "报废": ["售后服务费-报废费用"]
  "备件": ["售后服务费-备件费"]
  "运输": ["售后服务费-运输费"]
  "仓储": ["售后服务费-仓储费"]
  "RMA": ["售后服务费-RMA费用"]
  "赔偿": ["售后服务费-赔偿费"]
  "换机": ["售后服务费-换机费"]
  "固定费用": ["售后服务费-固定费用"]
  "安装费": ["售后服务费-安装费用"]
  "销售运输费": ["售后服务费-销售运输费用"]
