# 业务单元 = 品牌 × 品类。
# 「乐华·电视」已现场确认导航行；其余单元留待确认 nav_cell 后，把 启用 改为 true 并补 steps。
#
# webapp 的「品牌 × 品类」下拉与 `cli.py run-flow --unit` 都读取本文件：
#   - 单元 steps 必须与 config/flow.yaml 的 steps 顺序一一对应（表单名用于校验）；
#   - 选中单元后，steps[].nav_cell 会覆盖 flow.yaml 里写死的导航行；
#   - 可选：step.after_close_nav_cell（运行包导航行）、
#           unit.verify_nav_cell / verify_form_row（损益核对位置）。

品牌: [TCL, 雷鸟, 乐华]
品类: [电视, 空调, 冰箱, 洗衣机, TCL商用]

units:
  乐华·电视:
    启用: true
    品牌: 乐华
    品类: 电视
    # 损益核对导航单元格（缺省沿用 flow.yaml 的 verify.nav_cell）
    verify_nav_cell: AC70
    steps:
      - { 表单: 价格销量CT,  nav_cell: AC55 }
      - { 表单: 客户费用,    nav_cell: AC57 }
      - { 表单: HQ毛上调整,  nav_cell: AC59, after_close_nav_cell: AC62 }
      - { 表单: 其他成本,    nav_cell: AC63 }
      - { 表单: 费用及损益,  nav_cell: AC65, after_close_nav_cell: AC70 }

  # ---------- 以下为后续扩展预留（启用后需现场确认 nav_cell） ----------
  TCL·电视:    { 启用: false, 品牌: TCL, 品类: 电视 }
  雷鸟·电视:   { 启用: false, 品牌: 雷鸟, 品类: 电视 }
  TCL·空调:    { 启用: false, 品牌: TCL, 品类: 空调 }
  TCL·冰箱:    { 启用: false, 品牌: TCL, 品类: 冰箱 }
  TCL·洗衣机:  { 启用: false, 品牌: TCL, 品类: 洗衣机 }
  TCL·TCL商用: { 启用: false, 品牌: TCL, 品类: TCL商用 }
