# Dimensions — reusable across all forms.
# Version member keys follow pattern: C03 + YYYYMM + Vn
#   V1 = 月初版（每月 5 号左右编制）
#   V2 = 财总版（每月 20 号以后编制；AO 显示为"财总版"，口语也叫"财总会版"）
# 显示文本必须与导航表 AR45 完全一致，切版本时据此校验。
versions:
  C03202609V1: "滚动预测2026年9月月初版"
  C03202609V2: "滚动预测2026年9月财总版"
  C03202610V1: "滚动预测2026年10月月初版"
  C03202610V2: "滚动预测2026年10月财总版"
  C03202611V1: "滚动预测2026年11月月初版"
  C03202611V2: "滚动预测2026年11月财总版"   # 已现场核实 2026-11-19（AR45/C20）
  C03202612V1: "滚动预测2026年12月月初版"
  C03202612V2: "滚动预测2026年12月财总版"
  C03202701V1: "滚动预测2027年1月月初版"
  C03202701V2: "滚动预测2027年1月财总版"

# Config for the PBF Pro navigator workbook
navigator:
  workbook_pattern: "PBF Pro*全面预算系统流程导航*"
  nav_sheet: "PBF Pro - 全面预算系统流程导航"
  # 版本相关单元格（现场核对 2026-11-13）：
  #   AR45 = 版本显示文本（"滚动预测2026年11月月初版"）
  #   C20  = ZDCATEGRY 上下文成员（C03202611V1），F20 = 传入表单成员
  # 注意：E4 是模板自用的"前置流程结束行"，写它会破坏模板逻辑，切勿使用。
  version_display_cell: "AR45"
  version_context_cell: "C20"
  version_member_cell: "F20"
  # 切版本后等待 AO 生效的总时长（秒）。AO 刚登录时服务端会话未就绪，
  # 写入的版本变量可能被初始化覆盖、RefreshAll 可能被拒；此期间会
  # 反复「重写 C20/F20 + 设置 AO 版本过滤器 + 刷新」，直到 AR45 显示目标版本。
  version_switch_timeout_sec: 60
  # 登录 AO 后它会先自动刷新一遍；先等 AR45 有值再开始切版本，
  # 避免十几个 AO 调用全在重试（界面上看起来像卡死）。
  ao_ready_timeout_sec: 45
  # 登录框关闭后加载项会占住 Excel UI 线程自动刷新数据源（30s 级）。
  # 切版本前用普通 Excel 调用当空闲屏障，等刷新收尾（空闲时立即返回）；
  # 刷新期间调 SAPSetVariable 会把加载项打崩（「已断开所有数据源连接」）。
  ao_idle_timeout_sec: 30
  # 真正切版本：把目标版本写进 DS_PROCESSLIST 的提示变量再刷新，等价于
  # 选好版本后点「刷新状态」（导航表 VBA Refresh_Status）。只写 C20/F20 +
  # RefreshAll 不会切版本——AO 回显会把 C20 抄回旧值，AR45 永远不变。
  version_data_provider: "DS_PROCESSLIST"
  version_prompt_key_var: "ZCCSO_ZDCATEGRY_010"
  # Refresh_Status 同时把 C19（期间）写进期间提示变量；C03 版本时 C19 为空。
  version_prompt_time_var: "ZCCSO_ZDTIME_048"
  version_time_cell: "C19"
  # Macro names on navigator workbook
  refresh_macro: null   # Use generic RefreshAll

# Config for the run-package execution log form（现场核对 2026-11-12）
runner:
  workbook_pattern: "PBF Pro运行包执行及日志查看清单*"
  sheet: "运行包执行及日志查看清单"
  execute_macro: "Trigger_PS"
  refresh_macro: "Refresh_Sheet"
  step_cell: "AB73"      # 运行包步骤名
  status_cell: "AO73"    # 执行状态（已完成 / 运行中 / 失败）
  start_cell: "AU73"
  duration_cell: "AW73"
